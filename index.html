<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Pokémon Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Random Pokémon Generator</h1>
        <p class="subtitle">Original 151 Pokémon</p>

        <div id="pokemon-display" class="pokemon-card">
            <div class="pokemon-number" id="pokemon-number">???</div>
            <div class="pokemon-name" id="pokemon-name">Click the button to generate!</div>
        </div>

        <button id="generate-btn" class="generate-btn">Generate Random Pokémon</button>

        <div class="stats">
            <p>Total Pokémon: <span id="total-count">151</span></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
